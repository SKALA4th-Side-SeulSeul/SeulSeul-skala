name: seulseul-prod

x-bot-common: &bot-common
  build:
    context: .
  env_file:
    - .env
  environment:
    DATABASE_URL: ${DATABASE_URL:?DATABASE_URL을 운영 서버 .env에 설정하세요}
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:18.6-bookworm
    # DBeaver는 SSH 터널로만 접속. 외부 인터페이스 바인딩 금지.
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB를 운영 서버 .env에 설정하세요}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER를 운영 서버 .env에 설정하세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 운영 서버 .env에 설정하세요}
    volumes:
      - postgres_prod_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=20
    restart: unless-stopped
    mem_limit: 1g

  migrate:
    <<: *bot-common
    command: ["alembic", "upgrade", "head"]
    profiles: ["tools"]
    mem_limit: 512m

  bot:
    <<: *bot-common
    entrypoint: ["/app/scripts/run_bot.sh"]
    command: ["python", "-m", "seulseul.main"]
    restart: unless-stopped
    mem_limit: 512m

  oauth:
    <<: *bot-common
    command:
      - gunicorn
      - --bind
      - 0.0.0.0:8080
      - --workers
      - "1"
      - --threads
      - "2"
      - seulseul.oauth_wsgi:app
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL을 운영 서버 .env에 설정하세요}
      SLACK_OAUTH_PORT: ${SLACK_OAUTH_PORT:-8080}
      SLACK_OAUTH_STORAGE_DIR: /var/lib/seulseul/oauth
    ports:
      - "127.0.0.1:${SLACK_OAUTH_PORT:-8080}:8080"
    volumes:
      - oauth_data:/var/lib/seulseul/oauth
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    mem_limit: 256m

  ngrok:
    image: ngrok/ngrok:3.39.11-debian
    command:
      - http
      - oauth:8080
      - --url
      - https://${NGROK_DOMAIN:?NGROK_DOMAIN을 운영 서버 .env에 설정하세요}
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?NGROK_AUTHTOKEN을 운영 서버 .env에 설정하세요}
    depends_on:
      oauth:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m

volumes:
  postgres_prod_data:
  oauth_data:
