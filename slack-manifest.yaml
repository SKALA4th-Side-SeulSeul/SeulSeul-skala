_metadata:
  major_version: 1
  minor_version: 1

display_information:
  name: 슬슬
  description: Slack 공지를 학생별 체크리스트로 관리합니다.
  background_color: "#2F6B5F"

features:
  bot_user:
    display_name: seulseul
    always_online: true
  slash_commands:
    - command: /seulseul
      description: 개인 체크리스트 연동을 시작하거나 해지합니다.
      usage_hint: 시작 | 해지
      should_escape: false

oauth_config:
  scopes:
    bot:
      - channels:history
      - commands
      - groups:history
      - users:read
      - chat:write
      - im:write
      - im:history

settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - user_change
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
